name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the optimization script
        uses: actions/checkout@v7

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#166534&color_dots=#eef3ef,#d9f7df,#afe9bd,#7bd795,#45bd70
            dist/github-contribution-grid-snake-dark.svg?color_snake=#d1fae5&color_dots=#202722,#4f7659,#66a173,#7fc98b,#a1e6ad

      - name: Remove level bars and contribution-cell animations
        run: python3 .github/scripts/optimize_snake.py dist/*.svg

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
